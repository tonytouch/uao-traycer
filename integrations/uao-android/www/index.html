<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UAO</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1b1b1a; --muted: #6b6b66; --card: #ffffff;
    --line: #d9d9d3; --accent: #2a5bd7; --accent-fg: #ffffff; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --fg: #ececea; --muted: #9a9a94; --card: #1c1c1b;
      --line: #34342f; --accent: #7aa2ff; --accent-fg: #0b1020; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 16px/1.5 system-ui, sans-serif; min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; padding: 12px; font: 16px/1.4 ui-monospace, monospace;
    color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 8px;
    font: 600 16px system-ui, sans-serif; background: var(--accent); color: var(--accent-fg);
  }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  #status { margin-top: 12px; min-height: 1.5em; color: var(--muted); }
  #status.err { color: var(--err); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>UAO</h1>
  <p id="origin"></p>

  <section class="card" id="pair" hidden>
    <label for="secret">Pairing link or secret</label>
    <textarea id="secret" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="Paste the link from the server (…/uao-pair?token=…)"></textarea>
    <button id="save" type="button">Pair and connect</button>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="card" id="connect" hidden>
    <div id="connectMsg" role="status" aria-live="polite">Connecting…</div>
    <button id="retry" type="button" hidden>Try again</button>
    <button id="change" type="button" class="secondary" hidden>Change pairing secret</button>
  </section>
</main>

<script>
(function () {
  "use strict";
  // Must match server.allowNavigation in capacitor.config.json and the
  // UAO_SERVE_ALLOWED_ORIGINS entry on the server.
  var ORIGIN = "https://server.tail85e19.ts.net:10000";
  var KEY = "uao_pairing_secret";
  var MIN_LEN = 32;

  var $ = function (id) { return document.getElementById(id); };
  $("origin").textContent = ORIGIN.replace("https://", "");

  function readStore() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function writeStore(value) {
    try {
      if (value === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, value);
      return true;
    } catch (e) { return false; }
  }

  // Accepts a full pairing link or the bare secret.
  function extractSecret(input) {
    var text = String(input || "").trim();
    if (text === "") return null;
    var token = text;
    try {
      var url = new URL(text);
      token = url.searchParams.get("token") || "";
    } catch (e) { /* not a URL: treat as a bare secret */ }
    token = token.trim();
    return token.length >= MIN_LEN ? token : null;
  }

  function show(which) {
    $("pair").hidden = which !== "pair";
    $("connect").hidden = which !== "connect";
  }

  function showPair(message, isError) {
    show("pair");
    var status = $("status");
    status.textContent = message || "";
    status.className = isError ? "err" : "";
  }

  function reachable() {
    // An opaque no-cors response resolves for any HTTP status; only a
    // network-level failure (offline, Tailscale off) rejects.
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 8000);
    return fetch(ORIGIN + "/uao-pair", { mode: "no-cors", cache: "no-store", signal: controller.signal })
      .then(function () { clearTimeout(timer); return true; })
      .catch(function () { clearTimeout(timer); return false; });
  }

  function connect() {
    var secret = readStore();
    if (!secret) { showPair("", false); return; }
    show("connect");
    $("connectMsg").textContent = "Connecting…";
    $("retry").hidden = true;
    $("change").hidden = true;
    reachable().then(function (ok) {
      if (!ok) {
        $("connectMsg").textContent = "Can't reach the UAO server. Check that Tailscale is connected, then try again.";
        $("retry").hidden = false;
        $("change").hidden = false;
        return;
      }
      // Re-pairs on every launch (sets the session cookie), so a lost cookie
      // heals itself. assign() keeps this page in history for the Back button.
      window.location.assign(ORIGIN + "/uao-pair?token=" + encodeURIComponent(secret));
    });
  }

  $("save").addEventListener("click", function () {
    var secret = extractSecret($("secret").value);
    if (!secret) { showPair("That doesn't look like a pairing link or secret.", true); return; }
    if (!writeStore(secret)) { showPair("Could not save the secret on this device.", true); return; }
    $("secret").value = "";
    connect();
  });
  $("retry").addEventListener("click", connect);
  $("change").addEventListener("click", function () { writeStore(null); showPair("", false); });

  // Coming back here with Back means the server page was a dead end (wrong
  // secret, rotated secret): offer the choices instead of reconnecting in a loop.
  function cameBack() {
    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    return !!nav && nav.type === "back_forward";
  }
  function start() {
    if (cameBack() && readStore()) {
      show("connect");
      $("connectMsg").textContent = "Returned from the server. Reconnect, or change the pairing secret if it was rotated.";
      $("retry").hidden = false;
      $("change").hidden = false;
      return;
    }
    connect();
  }
  window.addEventListener("pageshow", function (event) { if (event.persisted) start(); });
  start();
})();
</script>
</body>
</html>
